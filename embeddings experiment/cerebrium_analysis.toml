[cerebrium.deployment]
name = "kv-prepend-analysis-cpu"
python_version = "3.11"
docker_base_image_url = "debian:bookworm-slim"
disable_auth = true
include = [
  "./main.py",
  "./cerebrium_main.py",
  "./cerebrium_analysis.toml",
  "./kv_prepend_experiment/**/*",
  "./default_experiment.json",
  "./spec_calibration_hf_3tasks.json",
  "./spec_main_hf_teacher_forcing_l40s_3tasks.json",
]
exclude = [
  "./legacy/**/*",
  "./archive/**/*",
  "./artifacts/**/*",
  "./__pycache__/**/*",
]

[cerebrium.hardware]
cpu = 10
memory = 60.0
compute = "CPU"
provider = "aws"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 1
response_grace_period = 3600
cooldown = 10
replica_concurrency = 1
scaling_metric = "concurrency_utilization"

[cerebrium.dependencies.pip]
numpy = "latest"
torch = "latest"
datasets = "latest"
